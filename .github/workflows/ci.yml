name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  AGAVE_VERSION: stable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Agave platform tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: ${{ runner.os }}-solana-${{ env.AGAVE_VERSION }}

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --all-features --no-deps

      - name: Check
        run: cargo check --locked --all-targets

      - name: Check without features
        run: cargo check --locked --no-default-features

      - name: Build program
        run: cargo build-sbf

      - name: Test
        run: cargo test --locked --all-targets

      - name: Bench
        run: cargo bench --bench compute_units
