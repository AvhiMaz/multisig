[package]
name = "multisig"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11.2", features = ["account-resize"] }
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
solana-instruction = { version = "3", optional = true }
solana-pubkey = { version = "3", optional = true, features = ["curve25519"] }
solana-sha256-hasher = "2.3.0"

[features]
client = ["dep:solana-instruction", "dep:solana-pubkey"]

[dev-dependencies]
# Self-dependency so `cargo test` builds with the client feature on: the
# integration tests drive the program through the client, not hand-rolled bytes.
multisig = { path = ".", features = ["client"] }
mollusk-svm = "0.15.1"
mollusk-svm-bencher = "0.15.1"
solana-account = "4.3"
solana-instruction = "3"
solana-program-error = "3"
solana-pubkey = "3"
solana-sha256-hasher = "2.3"

[[bench]]
name = "compute_units"
harness = false
